name: Probe
on:
  push:
    paths: [".github/workflows/probe.yml"]
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          python3 - <<'EOF'
          import urllib.request, lzma, struct, http.cookiejar, json
          def get(u, opener=None, h=None):
              req = urllib.request.Request(u, headers=h or {"User-Agent": "Mozilla/5.0"})
              try:
                  r = (opener or urllib.request.build_opener()).open(req, timeout=30)
                  return r.status, r.read()
              except Exception as e:
                  return str(e), b""
          base = "https://datafeed.dukascopy.com/datafeed/"
          for u in ["EURUSD/2026/09/BID_candles_hour_1.bi5", "USDJPY/2026/09/BID_candles_hour_1.bi5",
                    "EURUSD/2026/10/19/BID_candles_min_1.bi5", "EURUSD/2026/10/20/15h_ticks.bi5",
                    "EURUSD/2026/10/BID_candles_hour_1.bi5", "EURUSD/2026/10/20/BID_candles_min_1.bi5"]:
              st, b = get(base + u)
              info = ""
              if b:
                  try:
                      raw = lzma.decompress(b)
                      n = 20 if "ticks" in u else 24
                      info = f"records={len(raw)//n} first={struct.unpack('>' + ('iiiff' if n==20 else 'iiiiif'), raw[:n])} last={struct.unpack('>' + ('iiiff' if n==20 else 'iiiiif'), raw[-n:])}"
                  except Exception as e:
                      info = "decode err " + str(e)
              print("DUKA", u, st, len(b), info)
          cj = http.cookiejar.CookieJar()
          op = urllib.request.build_opener(urllib.request.HTTPCookieProcessor(cj))
          print("YF cookie", get("https://fc.yahoo.com", op)[0], len(cj))
          st, crumb = get("https://query1.finance.yahoo.com/v1/test/getcrumb", op)
          print("YF crumb", st, crumb[:20])
          for rng in ["5d", "730d"]:
              st, b = get(f"https://query1.finance.yahoo.com/v8/finance/chart/EURUSD=X?interval=1h&range={rng}&crumb={crumb.decode()}", op)
              print("YF chart", rng, st, len(b))
          st, b = get("https://nfs.faireconomy.media/ff_calendar_thisweek.json")
          print("FF", st, len(b))
          EOF
