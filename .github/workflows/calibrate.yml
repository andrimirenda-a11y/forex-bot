name: Calibrazione settimanale

on:
  schedule:
    - cron: "17 6 * * 6"   # sabato mattina, mercato chiuso
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: forex-bot
  cancel-in-progress: false

jobs:
  calibrate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - uses: actions/cache@v4
        with:
          path: .cache/duka
          key: duka-${{ github.run_id }}
          restore-keys: duka-
      - name: Dati aggiornati (branch data)
        run: |
          git config user.name "forex-bot"
          git config user.email "forex-bot@users.noreply.github.com"
          python -m bot.datasync pull
      - run: python -m bot.calibrate
      - name: Salva i risultati
        run: python -m bot.datasync push "Calibrazione settimanale"
