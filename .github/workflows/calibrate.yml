name: Calibrazione settimanale

on:
  schedule:
    - cron: "17 6 * * 6"   # sabato mattina, mercato chiuso
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: forex-bot
  cancel-in-progress: false

jobs:
  calibrate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m bot.calibrate
      - name: Salva i risultati
        run: |
          git config user.name "forex-bot"
          git config user.email "forex-bot@users.noreply.github.com"
          git add data
          git diff --cached --quiet && exit 0
          git commit -m "Calibrazione $(date -u +%Y-%m-%d)"
          for i in 1 2 3 4 5; do
            git pull --rebase -X theirs && git push && exit 0
            sleep $((i * 5))
          done
          exit 1
