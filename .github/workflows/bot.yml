name: Bot forex

on:
  schedule:
    - cron: "*/15 * * * *"   # ogni giro resta acceso ~50 minuti; il successivo è già in coda: bot sempre acceso
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: forex-bot
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -r requirements.txt

      # file storici Dukascopy già scaricati (non cambiano più): si tengono tra un giro e l'altro
      - uses: actions/cache@v4
        with:
          path: .cache/duka
          key: duka-${{ github.run_id }}
          restore-keys: duka-

      - name: Calibrazione (solo se manca, max una volta ogni 3 ore)
        continue-on-error: true
        timeout-minutes: 12
        run: python -m bot.calibrate --if-missing

      - name: Identità git per salvare i dati durante il giro
        run: |
          git config user.name "forex-bot"
          git config user.email "forex-bot@users.noreply.github.com"

      - name: Giro del bot (controllo del mercato ogni minuto per ~50 minuti)
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          APP_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
          LISTEN_MINUTES: "50"
          CYCLE_SECONDS: "60"
          PUSH_DURING_RUN: "1"
        run: python -m bot.main

      - name: Salva i dati
        if: always()
        run: |
          git config user.name "forex-bot"
          git config user.email "forex-bot@users.noreply.github.com"
          git add data
          git diff --cached --quiet && exit 0
          git commit -m "Aggiornamento bot $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3 4 5; do
            git pull --rebase -X theirs && git push && exit 0
            sleep $((i * 5))
          done
          exit 1
